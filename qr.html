<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2efe9" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <title>QR code — Rachel Belier</title>
  <meta name="description" content="QR code vers la fiche contact de Rachel Belier, pianiste." />
  <style>
    :root {
      --ink: #171614;
      --ivory: #f2efe9;
      --champagne: #c7a56d;
      --white: #faf8f4;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--ivory);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 720px);
      padding: clamp(24px, 6vw, 52px);
      display: grid;
      justify-items: center;
      gap: 18px;
      border: 1px solid rgba(23, 22, 20, .12);
      border-radius: 28px;
      background: var(--white);
      box-shadow: 0 24px 60px rgba(27, 19, 24, .12);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(34px, 6vw, 54px);
      font-weight: 500;
      letter-spacing: -.035em;
      line-height: 1;
      text-wrap: balance;
    }

    p {
      max-width: 46ch;
      margin: 0;
      color: #5f5a54;
      line-height: 1.55;
    }

    img {
      width: min(100%, 680px);
      height: auto;
      display: block;
      border-radius: 16px;
    }

    a {
      min-height: 48px;
      padding: 12px 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--ink);
      color: var(--ivory);
      font-size: 14px;
      font-weight: 750;
      text-decoration: none;
      touch-action: manipulation;
      transition: background-color .2s ease, transform .2s ease;
      -webkit-tap-highlight-color: rgba(199, 165, 109, .25);
    }

    a:hover {
      background: #765733;
      transform: translateY(-2px);
    }

    :focus-visible {
      outline: 3px solid var(--champagne);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Retrouvez Rachel Belier</h1>
    <p>Scannez ce QR code pour ouvrir la fiche de Rachel et l’ajouter à vos contacts.</p>
    <img src="qr-contact.png" alt="QR code vers la fiche contact de Rachel Belier" width="900" height="900" fetchpriority="high" />
    <a href="rachel-belier.vcf">Ouvrir la fiche contact</a>
  </main>
</body>
</html>
