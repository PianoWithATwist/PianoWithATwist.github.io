<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0d0d0e" />
  <title>QR code contact — Rachel Belier</title>
  <meta name="description" content="Scannez le QR code pour ajouter Rachel Belier à vos contacts." />
  <style>
    :root {
      --bg: #0d0d0e;
      --card: #171719;
      --text: #f6f2eb;
      --muted: #b7b0a6;
      --line: #2a292c;
      --accent: #e7dccb;
      --accent-soft: #c9bca8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(102, 80, 53, .22), transparent 30%),
        linear-gradient(180deg, #121214 0%, var(--bg) 65%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .card {
      width: min(100%, 430px);
      padding: 28px 24px 24px;
      border: 1px solid var(--line);
      border-radius: 30px;
      background: rgba(23, 23, 25, .96);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .38);
      text-align: center;
    }

    .back {
      display: block;
      margin-bottom: 24px;
      color: var(--muted);
      font-size: 14px;
      text-align: left;
      text-decoration: none;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--accent-soft);
      font-size: 12px;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 32px;
      font-weight: 500;
      letter-spacing: -.5px;
    }

    .intro {
      max-width: 330px;
      margin: 12px auto 22px;
      color: #d7d0c7;
      font-size: 14px;
      line-height: 1.55;
    }

    .qr-frame {
      width: 280px;
      max-width: 100%;
      min-height: 280px;
      margin: 0 auto 20px;
      padding: 20px;
      display: grid;
      place-items: center;
      border-radius: 22px;
      background: #f6f2eb;
    }

    #qrcode img,
    #qrcode canvas {
      display: block;
      width: 240px;
      max-width: 100%;
      height: auto;
    }

    .status {
      color: #625d56;
      font-size: 13px;
    }

    .hint {
      margin: 0 0 20px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .actions {
      display: grid;
      gap: 10px;
    }

    .button {
      display: block;
      width: 100%;
      padding: 14px 18px;
      border: 1px solid var(--line);
      border-radius: 15px;
      background: #111113;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      text-decoration: none;
      cursor: pointer;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #151515;
      font-weight: 700;
    }

    .button[hidden] { display: none; }

    .error {
      color: #8e2929;
      line-height: 1.45;
    }

    @media print {
      body { padding: 0; background: white; }
      .card { border: 0; box-shadow: none; color: #151515; }
      .back, .actions { display: none; }
      .intro, .hint { color: #444; }
    }
  </style>
</head>
<body>
  <main class="card">
    <a class="back" href="index.html">← Retour au site</a>
    <div class="eyebrow">Fiche contact</div>
    <h1>Rachel Belier</h1>
    <p class="intro">Scannez ce QR code avec l’appareil photo de votre téléphone pour ajouter Rachel à vos contacts.</p>

    <div class="qr-frame">
      <div id="qrcode" aria-label="QR code de la fiche contact Rachel Belier">
        <span class="status">Génération du QR code…</span>
      </div>
    </div>

    <p class="hint">Le QR code est généré automatiquement à partir de la fiche contact actuelle.</p>

    <div class="actions">
      <button class="button primary" id="download-qr" type="button" hidden>Télécharger le QR code</button>
      <a class="button" href="rachel-belier.vcf" download>Télécharger la fiche contact</a>
    </div>

    <noscript><p class="error">JavaScript doit être activé pour générer le QR code.</p></noscript>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    const qrContainer = document.querySelector('#qrcode');
    const downloadButton = document.querySelector('#download-qr');

    async function generateQrCode() {
      try {
        if (typeof QRCode === 'undefined') {
          throw new Error('La bibliothèque QR est indisponible.');
        }

        const response = await fetch('rachel-belier.vcf', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('La fiche contact est introuvable.');
        }

        const source = await response.text();
        const vcard = source.trim().replace(/\r?\n/g, '\r\n') + '\r\n';

        qrContainer.textContent = '';
        new QRCode(qrContainer, {
          text: vcard,
          width: 240,
          height: 240,
          colorDark: '#151515',
          colorLight: '#f6f2eb',
          correctLevel: QRCode.CorrectLevel.M
        });

        downloadButton.hidden = false;
      } catch (error) {
        qrContainer.innerHTML = '<span class="status error">Impossible de générer le QR code pour le moment.</span>';
        console.error(error);
      }
    }

    downloadButton.addEventListener('click', () => {
      const canvas = qrContainer.querySelector('canvas');
      const image = qrContainer.querySelector('img');
      const href = canvas ? canvas.toDataURL('image/png') : image?.src;

      if (!href) return;

      const link = document.createElement('a');
      link.href = href;
      link.download = 'qr-contact-rachel-belier.png';
      link.click();
    });

    generateQrCode();
  </script>
</body>
</html>
